<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلقات النور لتعليم القرآن الكريم</title>
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="video-container">
            <video autoplay muted loop id="bg-video">
                <source id="video-source" src="" type="video/mp4">
            </video>
            <div class="overlay"></div>
        </div>
        <div class="header-content">
            <img src="1768411699920.png" alt="شعار الحلقة" class="logo">
            <h1 id="header-title">حلقات النور</h1>
            <p id="header-subtitle">لتعليم القرآن الكريم</p>
            <div class="location-badge"><i class="fas fa-map-marker-alt"></i> <span id="header-location">المسجد</span></div>
        </div>
    </header>

    <div id="news-bar" class="news-ticker-container">
        <div class="ticker-title">آخـر الأخبـار</div>
        <div class="ticker-content">
            <span id="news-text">جاري تحميل الأخبار...</span>
        </div>
    </div>

    <div class="container">
        
        <section id="weekly-question" class="section-card question-box">
            <div class="q-header">
                <i class="fas fa-question-circle"></i> سؤال الأسبوع
            </div>
            <div class="q-body">
                <h3 id="question-text">...</h3>
                <div class="winner-badge">
                    <i class="fas fa-trophy"></i> الفائز السابق: <span id="winner-name">...</span>
                </div>
                <a href="https://wa.me/967730000000" target="_blank" class="btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> أرسل الإجابة
                </a>
            </div>
        </section>

        <div id="dynamic-btns-container" class="grid-buttons"></div>

        <section id="student-registration" class="section-card" style="display:none;">
            <h3><i class="fas fa-user-plus"></i> التسجيل</h3>
            <p>التسجيل متاح الآن للحلقات الجديدة.</p>
            <button class="main-btn">سجل الآن</button>
        </section>

        <section id="top-students" class="section-card">
            <h3><i class="fas fa-crown"></i> لوحة الشرف</h3>
            <div id="ranks-list" class="ranks-grid"></div>
        </section>

        <section id="schedule-section" class="section-card">
            <h3><i class="fas fa-calendar-alt"></i> الجداول الدراسية</h3>
            <div id="complex-schedule-container"></div>
        </section>

        <section id="teachers-section" class="section-card">
            <h3><i class="fas fa-chalkboard-teacher"></i> كادر المعلمين</h3>
            <div id="teachers-list-v2" class="teachers-grid"></div>
        </section>

        <div class="holidays-bar">
            <div id="holidays-ticker"></div>
        </div>

        <section class="about-section">
            <h3>عن الحلقات</h3>
            <p id="about-content">...</p>
        </section>

    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
        
        <button onclick="toggleLoginModal()" class="admin-lock-btn" style="background:none; border:none; color:#ffffff50; cursor:pointer; font-size:1.2rem;">
            <i class="fas fa-lock"></i>
        </button>
    </footer>

    <div id="loginModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center;">
            <h3 style="color: #047857; margin-bottom: 20px;">🔐 بوابة الإدارة</h3>
            
            <input type="email" id="admin_email" placeholder="البريد الإلكتروني" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px;">
            <input type="password" id="admin_pass" placeholder="كلمة المرور" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px;">
            
            <div style="display: flex; gap: 10px;">
                <button onclick="checkLogin()" class="btn-login" style="flex: 1; background: #047857; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer;">🚀 دخول</button>
                <button onclick="toggleLoginModal()" style="background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script src="js/custom_logic.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المدير</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
        
        /* القائمة الجانبية (التصميم القديم) */
        .sidebar {
            width: 260px;
            background-color: #1e293b; /* كحلي غامق */
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .sidebar h2 { text-align: center; margin-bottom: 30px; color: #34d399; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .nav-btn {
            background: none; border: none; color: #cbd5e1;
            padding: 15px; text-align: right; cursor: pointer;
            font-size: 1rem; font-family: 'Tajawal'; font-weight: bold;
            border-radius: 8px; margin-bottom: 5px; transition: 0.3s;
        }
        .nav-btn:hover, .nav-btn.active { background-color: #334155; color: white; padding-right: 20px; }
        
        /* منطقة المحتوى */
        .main-content {
            flex: 1; padding: 30px; overflow-y: auto;
        }
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* البطاقات والحقول */
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h3 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        
        input, select, textarea {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 1px solid #cbd5e1; border-radius: 8px;
            font-family: 'Tajawal'; box-sizing: border-box;
        }
        
        /* الأزرار */
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-save { background: #10b981; width: 100%; margin-top: 10px; }
        .btn-save:hover { background: #059669; }
        
        /* أزرار التحكم (تعديل/حذف/إخفاء) */
        .action-btn { padding: 5px 10px; border-radius: 6px; margin-left: 5px; font-size: 0.8rem; }
        .btn-edit { background: #f59e0b; } /* برتقالي للتعديل */
        .btn-del { background: #ef4444; }   /* أحمر للحذف */
        .btn-hide { background: #64748b; }  /* رمادي للإخفاء */
        
        /* القوائم الديناميكية */
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 10px; margin-bottom: 8px;
            border-radius: 8px; border-right: 4px solid #10b981;
        }
        .item-row.hidden { opacity: 0.6; background: #e2e8f0; border-right-color: #94a3b8; }
        
        /* إشعارات التوست */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 50px; padding: 16px; position: fixed;
            z-index: 1; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 17px;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>💎 لوحة المدير</h2>
        <button class="nav-btn active" onclick="showSection('sec_settings')">⚙️ الإعدادات والمظهر</button>
        <button class="nav-btn" onclick="showSection('sec_titles')">🏷️ تسميات الأقسام</button>
        <button class="nav-btn" onclick="showSection('sec_news')">📰 شريط الأخبار</button>
        <button class="nav-btn" onclick="showSection('sec_schedules')">📅 الجداول والوقت</button>
        <button class="nav-btn" onclick="showSection('sec_teachers')">👨‍🏫 المعلمون</button>
        <button class="nav-btn" onclick="showSection('sec_ranks')">🏆 الأوائل (10)</button>
        <button class="nav-btn" onclick="showSection('sec_cards')">🗂️ البطاقات الإضافية</button>
    </div>

    <div class="main-content">
        <div id="sec_settings" class="section active">
            <div class="card">
                <h3>🎨 مظهر الموقع (الثيمات)</h3>
                <label>اختر لون الموقع العام:</label>
                <select id="site_theme_selector">
                    <option value="theme-green">🟢 الثريا الأصلي (أخضر)</option>
                    <option value="theme-blue">🔵 أزرق رسمي</option>
                    <option value="theme-gold">👑 ذهبي ملكي</option>
                    <option value="theme-night">🌑 ليلي فاخر</option>
                    <option value="theme-purple">🟣 بنفسجي مبدع</option>
                    <option value="theme-red">🔴 أحمر حيوي</option>
                    <option value="theme-teal">🌊 تركواز هادئ</option>
                    <option value="theme-brown">🟤 بني كلاسيك</option>
                    <option value="theme-orange">🟠 برتقالي نشيط</option>
                    <option value="theme-pink">🌸 وردي لطيف</option>
                </select>
                <button class="btn btn-save" onclick="saveThemeSettings()">حفظ اللون</button>
            </div>

            <div class="card">
                <h3>🔌 حالة الموقع</h3>
                <label style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="toggle_maint" style="width:auto;">
                    تفعيل وضع الصيانة (إغلاق الموقع)
                </label>
                <button class="btn btn-save" onclick="saveGeneralSettings()">حفظ الحالة</button>
            </div>

            <div class="card">
                <h3>🎓 التحكم بأزرار "ركن الطالب"</h3>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                    <label><input type="checkbox" id="show_btn_quran" style="width:auto;"> 📖 المصحف</label>
                    <label><input type="checkbox" id="show_btn_adhkar" style="width:auto;"> 📿 الأذكار</label>
                    <label><input type="checkbox" id="show_btn_mutoon" style="width:auto;"> 📚 المتون</label>
                    <label><input type="checkbox" id="show_btn_exams" style="width:auto;"> 📝 الاختبارات</label>
                    <label><input type="checkbox" id="show_btn_reports" style="width:auto;"> 📊 التقارير</label>
                    <label><input type="checkbox" id="show_btn_plans" style="width:auto;"> 🏆 الخطط</label>
                </div>
                <button class="btn btn-save" onclick="saveStudentCorner()">حفظ الأزرار</button>
            </div>
        </div>

        <div id="sec_titles" class="section">
            <div class="card">
                <h3>🏷️ تعديل عناوين الأقسام الرئيسية</h3>
                <p style="color:gray; font-size:0.9rem;">غير أسماء الأقسام كما تحب (اتركها فارغة للوضع الافتراضي)</p>
                
                <label>عنوان "ركن الطالب":</label>
                <input type="text" id="inp_title_student" placeholder="الافتراضي: ركن الطالب">
                
                <label>عنوان "المعلمون":</label>
                <input type="text" id="inp_title_teachers" placeholder="الافتراضي: معلمو الحلقات">
                
                <label>عنوان "الأوائل":</label>
                <input type="text" id="inp_title_ranks" placeholder="الافتراضي: لوحة الشرف">
                
                <label>عنوان "الجداول":</label>
                <input type="text" id="inp_title_schedules" placeholder="الافتراضي: الجداول الدراسية">

                <button class="btn btn-save" onclick="saveSectionTitles()">حفظ التسميات</button>
            </div>
        </div>

        <div id="sec_news" class="section">
            <div class="card">
                <h3>📰 إدارة شريط الأخبار</h3>
                <input type="hidden" id="edit_news_key"> <input type="text" id="inp_news_text" placeholder="نص الخبر...">
                
                <label style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="inp_news_marquee" style="width:auto;" checked>
                    خبر متحرك (شريط)
                </label>
                
                <label style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="inp_news_clickable" style="width:auto;" onchange="document.getElementById('news_details_box').style.display = this.checked ? 'block' : 'none'">
                    قابل للنقر (يفتح تفاصيل)
                </label>
                
                <div id="news_details_box" style="display:none;">
                    <textarea id="inp_news_details" placeholder="التفاصيل عند النقر..."></textarea>
                </div>

                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="btn btn-save" id="btn_add_news" onclick="addNews()">➕ إضافة الخبر</button>
                    <button class="btn" id="btn_cancel_news" onclick="resetNewsForm()" style="background:#64748b; display:none;">إلغاء</button>
                </div>
            </div>
            
            <div id="news-list-admin">
                </div>
        </div>
        <div id="sec_schedules" class="section">
            <div class="card">
                <h3>📅 إضافة/تعديل جدول</h3>
                <input type="hidden" id="edit_sched_key">
                <input type="hidden" id="edit_sched_parent">

                <label>الفترة:</label>
                <select id="sched_time_select">
                    <option value="time_1">☀️ حلقات العصر</option>
                    <option value="time_2">🌙 حلقات المغرب</option>
                </select>

                <label>اسم الحلقة:</label>
                <input type="text" id="sched_name" placeholder="اسم الحلقة">
                
                <label>وقت الحضور:</label>
                <input type="text" id="sched_real_time" placeholder="مثال: 4:30 م">

                <div style="background:#f8fafc; padding:10px; border-radius:8px; border:1px solid #e2e8f0;">
                    <input type="text" id="day_sat" placeholder="السبت">
                    <input type="text" id="day_sun" placeholder="الأحد">
                    <input type="text" id="day_mon" placeholder="الاثنين">
                    <input type="text" id="day_tue" placeholder="الثلاثاء">
                    <input type="text" id="day_wed" placeholder="الأربعاء">
                </div>

                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="btn btn-save" onclick="saveSchedule()">💾 حفظ الجدول</button>
                    <button class="btn" onclick="resetScheduleForm()" style="background:#64748b;">إلغاء</button>
                </div>
            </div>
            <div id="schedules-list-admin"></div>
        </div>

        <div id="sec_teachers" class="section">
            <div class="card">
                <h3>👨‍🏫 بيانات المعلم</h3>
                <input type="hidden" id="edit_teacher_key">
                <input type="text" id="t_name" placeholder="اسم المعلم">
                <input type="text" id="t_role" placeholder="الوصف (مثال: حلقة زيد)">
                <div style="display:flex; gap:5px;">
                    <button class="btn btn-save" onclick="saveTeacher()">💾 حفظ</button>
                    <button class="btn" onclick="resetTeacherForm()" style="background:#64748b;">إلغاء</button>
                </div>
            </div>
            <div id="teachers-list-admin"></div>
        </div>

        <div id="sec_ranks" class="section">
            <div class="card">
                <h3>🏆 لوحة الشرف</h3>
                <input type="hidden" id="edit_rank_key">
                <select id="rank_num">
                    <option value="1">🥇 الأول</option> <option value="2">🥈 الثاني</option>
                    <option value="3">🥉 الثالث</option> <option value="4">🏅 الرابع</option>
                    <option value="5">🎖️ الخامس</option> <option value="6">🏵️ السادس</option>
                    <option value="7">🎗️ السابع</option> <option value="8">🌟 الثامن</option>
                    <option value="9">💎 التاسع</option> <option value="10">👑 العاشر</option>
                </select>
                <input type="text" id="rank_name" placeholder="اسم الطالب">
                <input type="text" id="rank_ring" placeholder="اسم الحلقة">
                <div style="display:flex; gap:5px;">
                    <button class="btn btn-save" onclick="saveRank()">💾 حفظ</button>
                    <button class="btn" onclick="resetRankForm()" style="background:#64748b;">إلغاء</button>
                </div>
            </div>
            <div id="ranks-list-admin"></div>
        </div>

        <div id="sec_cards" class="section">
            <div class="card">
                <h3>🗂️ بطاقة مخصصة</h3>
                <input type="hidden" id="edit_card_key">
                <input type="text" id="card_title" placeholder="العنوان">
                <textarea id="card_text" placeholder="المحتوى..." rows="3"></textarea>
                <label>لون الشريط:</label>
                <input type="color" id="card_color" value="#10b981" style="height:40px; padding:0;">
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="btn btn-save" onclick="saveCard()">💾 حفظ البطاقة</button>
                    <button class="btn" onclick="resetCardForm()" style="background:#64748b;">إلغاء</button>
                </div>
            </div>
            <div id="cards-list-admin"></div>
        </div>

    </div> <div id="toast">تم الحفظ بنجاح</div>

    <script>
        // 1. إعدادات فايربيس
        const firebaseConfig = {
            apiKey: "AIzaSyB...", // ⚠️ ضع مفتاحك هنا
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. أدوات الواجهة
        function showSection(id) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg; t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }
        function val(id) { return document.getElementById(id).value; }
        function setVal(id, v) { document.getElementById(id).value = v; }
        function getEl(id) { return document.getElementById(id); }

        // 3. تحميل البيانات
        db.ref().on('value', snap => {
            const d = snap.val() || {};
            
            // الإعدادات
            if(d.settings) {
                if(d.settings.theme) getEl('site_theme_selector').value = d.settings.theme;
                getEl('toggle_maint').checked = d.settings.maintenance_mode || false;
                
                // ركن الطالب
                const sc = d.settings.student_corner || {};
                ['quran','adhkar','mutoon','exams','reports','plans'].forEach(k => {
                    if(getEl('show_btn_'+k)) getEl('show_btn_'+k).checked = sc[k] !== false;
                });

                // العناوين
                const titles = d.settings.titles || {};
                setVal('inp_title_student', titles.student || '');
                setVal('inp_title_teachers', titles.teachers || '');
                setVal('inp_title_ranks', titles.ranks || '');
                setVal('inp_title_schedules', titles.schedules || '');
            }

            // رسم القوائم
            renderList('news-list-admin', d.news_list, 'news');
            renderSchedulesList(d.schedule_complex);
            renderList('teachers-list-admin', d.teachers_list_v2, 'teacher');
            renderList('ranks-list-admin', d.ranks_list, 'rank');
            renderList('cards-list-admin', d.custom_cards, 'card');
        });

        // 4. دوال الحفظ العامة
        function saveThemeSettings() { db.ref('settings/theme').set(val('site_theme_selector')).then(()=>showToast('تم تغيير اللون')); }
        function saveGeneralSettings() { db.ref('settings/maintenance_mode').set(getEl('toggle_maint').checked).then(()=>showToast('تم حفظ الحالة')); }
        function saveStudentCorner() {
            const data = {
                quran: getEl('show_btn_quran').checked, adhkar: getEl('show_btn_adhkar').checked,
                mutoon: getEl('show_btn_mutoon').checked, exams: getEl('show_btn_exams').checked,
                reports: getEl('show_btn_reports').checked, plans: getEl('show_btn_plans').checked
            };
            db.ref('settings/student_corner').set(data).then(()=>showToast('تم حفظ الأزرار'));
        }
        function saveSectionTitles() {
            db.ref('settings/titles').set({
                student: val('inp_title_student'), teachers: val('inp_title_teachers'),
                ranks: val('inp_title_ranks'), schedules: val('inp_title_schedules')
            }).then(()=>showToast('تم حفظ العناوين'));
        }

        // 5. دوال الإضافة والتعديل (CRUD)
        
        // أ. الأخبار
        function addNews() {
            const data = { text: val('inp_news_text'), isMarquee: getEl('inp_news_marquee').checked, isClickable: getEl('inp_news_clickable').checked, details: val('inp_news_details'), isHidden: false };
            const key = val('edit_news_key');
            if(key) db.ref('news_list/'+key).update(data).then(()=>{ showToast('تم التعديل'); resetNewsForm(); });
            else db.ref('news_list').push(data).then(()=>{ showToast('تمت الإضافة'); resetNewsForm(); });
        }
        function resetNewsForm() { setVal('edit_news_key',''); setVal('inp_news_text',''); getEl('btn_add_news').innerText='➕ إضافة'; getEl('btn_cancel_news').style.display='none'; }

        // ب. الجداول
        function saveSchedule() {
            const parent = val('sched_time_select');
            const data = { name: val('sched_name'), time: val('sched_real_time'), sat: val('day_sat'), sun: val('day_sun'), mon: val('day_mon'), tue: val('day_tue'), wed: val('day_wed') };
            const key = val('edit_sched_key');
            if(key) {
                const oldParent = val('edit_sched_parent');
                if(oldParent !== parent) { db.ref(`schedule_complex/${oldParent}/rings/${key}`).remove(); db.ref(`schedule_complex/${parent}/rings`).push(data); }
                else db.ref(`schedule_complex/${parent}/rings/${key}`).update(data);
                showToast('تم التعديل');
            } else db.ref(`schedule_complex/${parent}/rings`).push(data).then(()=>showToast('تمت الإضافة'));
            resetScheduleForm();
        }
        function resetScheduleForm() { setVal('edit_sched_key',''); setVal('sched_name',''); setVal('sched_real_time',''); ['sat','sun','mon','tue','wed'].forEach(d=>setVal('day_'+d,'')); }

        // ج. المعلمون
        function saveTeacher() {
            const data = { name: val('t_name'), role: val('t_role') };
            const key = val('edit_teacher_key');
            if(key) db.ref('teachers_list_v2/'+key).update(data); else db.ref('teachers_list_v2').push(data);
            showToast('تم الحفظ'); resetTeacherForm();
        }
        function resetTeacherForm() { setVal('edit_teacher_key',''); setVal('t_name',''); setVal('t_role',''); }

        // د. الأوائل
        function saveRank() {
            const data = { name: val('rank_name'), rank: val('rank_num'), ring: val('rank_ring') };
            const key = val('edit_rank_key');
            if(key) db.ref('ranks_list/'+key).update(data); else db.ref('ranks_list').push(data);
            showToast('تم الحفظ'); resetRankForm();
        }
        function resetRankForm() { setVal('edit_rank_key',''); setVal('rank_name',''); setVal('rank_ring',''); }

        // هـ. البطاقات
        function saveCard() {
            const data = { title: val('card_title'), text: val('card_text'), color: val('card_color') };
            const key = val('edit_card_key');
            if(key) db.ref('custom_cards/'+key).update(data); else db.ref('custom_cards').push(data);
            showToast('تم الحفظ'); resetCardForm();
        }
        function resetCardForm() { setVal('edit_card_key',''); setVal('card_title',''); setVal('card_text',''); }

        // 6. دوال الرسم الموحدة (Render)
        function renderList(elmId, data, type) {
            const el = document.getElementById(elmId); el.innerHTML = '';
            if(!data) return;
            Object.entries(data).forEach(([key, item]) => {
                let txt = '';
                if(type === 'news') txt = item.text;
                else if(type === 'teacher') txt = `${item.name} (${item.role})`;
                else if(type === 'rank') txt = `#${item.rank} ${item.name}`;
                else if(type === 'card') txt = item.title;
                
                el.innerHTML += `
                    <div class="item-row ${item.isHidden ? 'hidden' : ''}">
                        <span>${txt}</span>
                        <div>
                            <button class="action-btn btn-hide" onclick="toggleHide('${type}', '${key}', ${item.isHidden})">${item.isHidden ? '👁️' : '🚫'}</button>
                            <button class="action-btn btn-edit" onclick='editItem("${type}", "${key}", ${JSON.stringify(item)})'>✏️</button>
                            <button class="action-btn btn-del" onclick="del('${type}', '${key}')">🗑️</button>
                        </div>
                    </div>`;
            });
        }
        function renderSchedulesList(data) {
            const el = document.getElementById('schedules-list-admin'); el.innerHTML = '';
            if(!data) return;
            Object.keys(data).forEach(pKey => {
                if(data[pKey].rings) {
                    el.innerHTML += `<h4>${pKey==='time_1'?'☀️ عصر':'🌙 مغرب'}</h4>`;
                    Object.entries(data[pKey].rings).forEach(([key, ring]) => {
                        el.innerHTML += `
                        <div class="item-row ${ring.isHidden ? 'hidden' : ''}">
                            <span>${ring.name} (${ring.time||''})</span>
                            <div>
                                <button class="action-btn btn-hide" onclick="toggleHide('sched', '${pKey}/rings/${key}', ${ring.isHidden})">${ring.isHidden ? '👁️' : '🚫'}</button>
                                <button class="action-btn btn-edit" onclick='editSched("${pKey}", "${key}", ${JSON.stringify(ring)})'>✏️</button>
                                <button class="action-btn btn-del" onclick="del('sched', '${pKey}/rings/${key}')">🗑️</button>
                            </div>
                        </div>`;
                    });
                }
            });
        }

        // 7. Helpers (Delete, Toggle, Edit Router)
        function del(type, pathSuffix) {
            if(!confirm('حذف؟')) return;
            let path = '';
            if(type==='news') path='news_list/'+pathSuffix;
            else if(type==='sched') path='schedule_complex/'+pathSuffix;
            else if(type==='teacher') path='teachers_list_v2/'+pathSuffix;
            else if(type==='rank') path='ranks_list/'+pathSuffix;
            else if(type==='card') path='custom_cards/'+pathSuffix;
            db.ref(path).remove();
        }
        function toggleHide(type, pathSuffix, current) {
            let path = '';
            if(type==='news') path='news_list/'+pathSuffix;
            else if(type==='sched') path='schedule_complex/'+pathSuffix;
            else if(type==='teacher') path='teachers_list_v2/'+pathSuffix;
            else if(type==='rank') path='ranks_list/'+pathSuffix;
            else if(type==='card') path='custom_cards/'+pathSuffix;
            db.ref(path).update({ isHidden: !current });
        }
        function editItem(type, key, item) {
            if(type==='news') { setVal('edit_news_key', key); setVal('inp_news_text', item.text); getEl('inp_news_marquee').checked = item.isMarquee; getEl('inp_news_clickable').checked = item.isClickable; setVal('inp_news_details', item.details); getEl('btn_add_news').innerText='💾 حفظ'; getEl('btn_cancel_news').style.display='inline'; window.scrollTo(0,0); }
            else if(type==='teacher') { setVal('edit_teacher_key', key); setVal('t_name', item.name); setVal('t_role', item.role); }
            else if(type==='rank') { setVal('edit_rank_key', key); setVal('rank_name', item.name); setVal('rank_num', item.rank); setVal('rank_ring', item.ring); }
            else if(type==='card') { setVal('edit_card_key', key); setVal('card_title', item.title); setVal('card_text', item.text); setVal('card_color', item.color); }
        }
        function editSched(parent, key, item) {
            setVal('edit_sched_key', key); setVal('edit_sched_parent', parent); setVal('sched_time_select', parent);
            setVal('sched_name', item.name); setVal('sched_real_time', item.time);
            ['sat','sun','mon','tue','wed'].forEach(d => setVal('day_'+d, item[d]));
        }
    </script>
</body>
</html>
